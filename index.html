<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำอวยพรวันแต่งงาน Way & Ann</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+Thai:wght@300;400;500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --cream: #FCF9F2; 
      --pink-pastel: #FADCD9; 
      --pink-dark: #D88C9A;
      --green-pastel: #E2EFE6; 
      --green-dark: #8BA895;
      --text-main: #4A403A; 
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      font-family: 'Noto Sans Thai', sans-serif; 
      color: var(--text-main); 
      background-color: var(--cream);
      background-image: radial-gradient(var(--pink-pastel) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    
    .font-modern-thai { font-family: 'Prompt', sans-serif; letter-spacing: 0.5px; }
    .font-elegant-eng { font-family: 'Cormorant Garamond', serif; font-style: italic; }

    .logo-blend {
      mix-blend-mode: multiply;
      filter: contrast(1.1); 
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 15px 35px rgba(216, 140, 154, 0.1);
    }
    .field { border: 2px solid #F0EBE1; background: #FFFFFF; transition: all 0.3s; }
    .field:focus { border-color: var(--pink-dark); outline: none; box-shadow: 0 0 0 4px rgba(216, 140, 154, 0.1); }
    
    .btn-pastel {
      background: linear-gradient(135deg, var(--pink-dark), #e29caa);
      color: white;
      box-shadow: 0 4px 15px rgba(216, 140, 154, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .btn-pastel:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(216, 140, 154, 0.4);}

    .polaroid {
      background: #fff;
      padding: 10px 10px 35px 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      border-radius: 2px;
      display: inline-block;
      transform: rotate(-2deg);
      transition: all 0.3s ease;
      cursor: pointer; 
    }
    .polaroid:hover { transform: rotate(0deg) scale(1.05); z-index: 10; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
    .polaroid img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #f8f8f8;
      border: 1px solid #f0f0f0;
    }

    .message-bubble {
      border: 1.5px solid #F0EBE1;
      border-radius: 16px;
      padding: 24px;
      background: white;
      position: relative;
      flex-grow: 1;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    input[type="file"] { display: none; }

    .reveal { animation: fadeUp 1s ease-out forwards; opacity: 0; }
    .reveal-delay { animation: fadeUp 1s ease-out 0.4s forwards; opacity: 0; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-enter { animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
 </head>

 <body class="w-full">
  
  <!-- ส่วนปก (Cover) ปรับให้รูปแสดง 100% แบบไม่มีทางโดนตัดขอบ -->
  <header class="w-full relative">
    <div class="w-full max-w-5xl mx-auto reveal pt-8 sm:pt-12 px-4 md:px-8">
      <!-- รูปภาพจะย่อ-ขยายตามสัดส่วนจริง พร้อมขอบมนและเงาสวยๆ -->
      <img src="cover.jpg" alt="Way and Ann Wedding Cover" class="w-full h-auto rounded-xl shadow-lg border-4 border-white" onerror="this.src='cover.png'">
    </div>
    
    <!-- ปุ่มเลื่อนลงมาอวยพร -->
    <div class="w-full text-center py-10 sm:py-14 reveal-delay">
      <p class="font-modern-thai font-light text-base md:text-lg text-[#7A706A] mb-6 px-4">ร่วมแสดงความยินดีและเป็นสักขีพยานในวันสำคัญของเรา</p>
      <a href="#write-wish" class="font-modern-thai btn-pastel inline-flex items-center rounded-full px-12 py-3.5 font-medium tracking-wide">ร่วมอวยพรบ่าวสาว 🤍</a>
    </div>
  </header>

  <main class="w-full">
   <section id="write-wish" class="w-full px-4 py-8 sm:px-10">
    <div class="mx-auto w-full max-w-6xl">
     <div class="mb-14 text-center reveal">
      <p class="font-elegant-eng text-4xl text-[#8BA895] mb-3">Guestbook</p>
      <h2 class="font-modern-thai text-3xl font-medium text-[#4A403A]">สมุดอวยพร</h2>
     </div>

     <div class="grid items-start gap-12 lg:grid-cols-[1fr_1.2fr]">
      
      <form id="wish-form" class="glass-card rounded-[2rem] p-6 sm:p-10 reveal">
       <div class="mb-6">
        <label for="guest-name" class="font-modern-thai mb-2 block font-medium text-[#7A706A]">ชื่อของคุณ</label> 
        <input id="guest-name" class="font-modern-thai font-light field w-full rounded-2xl px-5 py-3.5 text-[#4A403A]" type="text" placeholder="ระบุชื่อของคุณ..." required>
       </div>
       
       <div class="mb-6">
        <label for="wish-message" class="font-modern-thai mb-2 block font-medium text-[#7A706A]">ข้อความอวยพร</label> 
        <textarea id="wish-message" class="font-modern-thai font-light field min-h-[140px] w-full resize-y rounded-2xl px-5 py-3.5 text-[#4A403A]" placeholder="เขียนความรู้สึกดีๆ..." required></textarea>
       </div>

       <div class="mb-8">
        <p class="font-modern-thai mb-2 block font-medium text-[#7A706A]">แนบรูปภาพ (ไม่บังคับ)</p>
        <label for="image-upload" class="font-modern-thai inline-flex items-center gap-2 px-5 py-3 bg-white text-[#8BA895] rounded-xl cursor-pointer hover:bg-[#F9FAF9] transition font-medium border border-[#E2EFE6] shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          เลือกรูปภาพโพลารอยด์
        </label>
        <input id="image-upload" type="file" accept="image/*">
        
        <div id="image-preview-container" class="hidden mt-6">
           <div class="polaroid w-40 cursor-default">
             <img id="image-preview" src="" alt="preview">
           </div>
           <button type="button" id="remove-image" class="font-modern-thai block mt-3 text-sm text-[#D88C9A] hover:text-red-500 transition">ลบรูปภาพ ✕</button>
        </div>
       </div>

       <button id="submit-button" class="font-modern-thai btn-pastel w-full rounded-2xl px-6 py-4 font-medium text-lg tracking-wide" type="submit">ส่งข้อความ 🤍</button>
       
       <div class="font-modern-thai mt-4 h-6 text-center text-sm font-medium">
         <p id="sending-status" class="hidden text-[#8BA895]">กำลังส่งข้อมูล...</p>
         <p id="success-status" class="hidden text-[#D88C9A]">ส่งข้อความเรียบร้อย ขอบคุณครับ/ค่ะ!</p>
         <p id="error-status" class="hidden text-red-400">เกิดข้อผิดพลาด ลองใหม่อีกครั้ง</p>
       </div>
      </form>

      <div class="reveal">
       <div class="mb-8 flex items-end justify-between gap-4 border-b border-[#E2EFE6] pb-4">
        <h2 class="font-modern-thai text-xl font-medium text-[#4A403A]">ข้อความจากแขกผู้มีเกียรติ</h2>
        <span id="wish-count" class="font-modern-thai text-sm text-[#8BA895]"></span>
       </div>
       <div id="wish-list" class="flex flex-col gap-6 max-h-[700px] overflow-y-auto pr-2" style="scrollbar-width: thin; scrollbar-color: #E2EFE6 transparent;"></div>
      </div>

     </div>
    </div>
   </section>
  </main>
  
  <footer class="w-full py-12 text-center">
    <div class="flex justify-center mb-4">
      <img src="logo.png" alt="NJ" class="logo-blend w-12 opacity-70" onerror="this.src='logo.jpg'">
    </div>
    <p class="font-elegant-eng text-xl text-[#8BA895]">Thank you for being part of our story</p>
  </footer>

  <div id="image-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 transition-opacity cursor-pointer">
    <button id="close-modal" class="absolute top-6 right-6 md:top-10 md:right-10 text-white hover:text-[#D88C9A] transition text-4xl">&times;</button>
    <img id="modal-image" src="" alt="ภาพขยาย" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl modal-enter cursor-default">
  </div>

  <template id="wish-template">
   <div class="flex flex-col sm:flex-row gap-5 items-start w-full transition-transform hover:-translate-y-1 duration-300">
     <div data-template-id="image-container" class="w-full sm:w-48 flex-shrink-0 hidden pt-2">
       <div class="polaroid w-full max-w-[180px] mx-auto sm:mx-0" title="คลิกเพื่อดูรูปใหญ่">
         <img data-template-id="wish-image" src="" alt="guest photo">
       </div>
     </div>

     <div class="message-bubble w-full">
       <h3 data-template-id="wish-name" class="font-modern-thai font-medium text-[#D88C9A] text-lg mb-3"></h3>
       <p data-template-id="wish-message" class="font-modern-thai font-light whitespace-pre-wrap leading-relaxed text-[#4A403A]"></p>
       <div class="mt-4 text-right">
         <time data-template-id="wish-date" class="font-modern-thai font-light text-xs text-[#A39E9B]"></time>
       </div>
     </div>
   </div>
  </template>

  <script>
    const form = document.getElementById('wish-form');
    const submitButton = document.getElementById('submit-button');
    const list = document.getElementById('wish-list');
    const count = document.getElementById('wish-count');
    const imageInput = document.getElementById('image-upload');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const removeImageBtn = document.getElementById('remove-image');
    
    const imageModal = document.getElementById('image-modal');
    const modalImage = document.getElementById('modal-image');
    const closeModalBtn = document.getElementById('close-modal');
    
    let base64Image = null;

    function openModal(imgSrc) {
      modalImage.src = imgSrc;
      imageModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; 
    }
    
    function closeModal() {
      imageModal.classList.add('hidden');
      setTimeout(() => { modalImage.src = ''; }, 300);
      document.body.style.overflow = ''; 
    }

    closeModalBtn.addEventListener('click', closeModal);
    imageModal.addEventListener('click', (e) => {
      if (e.target === imageModal) closeModal();
    });

    imageInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800; 
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          base64Image = canvas.toDataURL('image/jpeg', 0.8);
          
          imagePreview.src = base64Image;
          imagePreviewContainer.classList.remove('hidden');
        }
      }
    });

    removeImageBtn.addEventListener('click', () => {
      imageInput.value = '';
      base64Image = null;
      imagePreviewContainer.classList.add('hidden');
    });

    function showStatus(id) {
      ['sending-status', 'success-status', 'error-status'].forEach(key => {
        document.getElementById(key).classList.toggle('hidden', key !== id);
      });
    }

    async function fetchWishes() {
      const response = await fetch('/api/wishes');
      const data = await response.json();
      renderWishes(data);
    }

    function renderWishes(data) {
      list.innerHTML = ''; 
      count.textContent = `${data.length} ข้อความ`;
      data.forEach(record => {
        const card = document.getElementById('wish-template').content.cloneNode(true);
        card.querySelector('[data-template-id="wish-name"]').textContent = record.guest_name;
        card.querySelector('[data-template-id="wish-message"]').textContent = record.message;
        
        if (record.image_base64) {
          const imgContainer = card.querySelector('[data-template-id="image-container"]');
          const imgElement = card.querySelector('[data-template-id="wish-image"]');
          
          imgElement.src = record.image_base64;
          imgContainer.classList.remove('hidden');
          
          const polaroidDiv = imgContainer.querySelector('.polaroid');
          polaroidDiv.addEventListener('click', () => {
            openModal(record.image_base64);
          });
        }
        
        const parsed = new Date(record.created_at + 'Z'); 
        card.querySelector('[data-template-id="wish-date"]').textContent = new Intl.DateTimeFormat('th-TH', { dateStyle:'medium', timeStyle:'short' }).format(parsed);
        
        list.appendChild(card);
      });
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      
      const guestName = document.getElementById('guest-name').value.trim();
      const message = document.getElementById('wish-message').value.trim();
      
      submitButton.disabled = true;
      submitButton.innerHTML = "กำลังส่ง...";
      showStatus('sending-status');

      try {
        const response = await fetch('/api/wishes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guest_name: guestName, message: message, image_base64: base64Image })
        });

        if (response.ok) {
          form.reset();
          removeImageBtn.click();
          showStatus('success-status');
          fetchWishes(); 
        } else {
          showStatus('error-status');
        }
      } catch (error) {
        showStatus('error-status');
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = "ส่งข้อความ 🤍";
        setTimeout(() => { document.getElementById('success-status').classList.add('hidden'); }, 3000);
      }
    });

    fetchWishes();
  </script>
 </body>
</html>
