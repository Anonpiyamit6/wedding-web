<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำอวยพรวันแต่งงาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Noto+Sans+Thai:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --cream: #FCF9F2; 
      --pink-pastel: #FADCD9; 
      --pink-dark: #D88C9A;
      --green-pastel: #E2EFE6; 
      --green-dark: #8BA895;
      --text-main: #5C4D4D;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      font-family: 'Noto Sans Thai', sans-serif; 
      color: var(--text-main); 
      background-color: var(--cream);
      background-image: radial-gradient(var(--pink-pastel) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .font-romantic { font-family: 'Charm', cursive; }
    .font-eng-script { font-family: 'Great Vibes', cursive; }
    
    .hero-bg {
      background: linear-gradient(135deg, rgba(252,249,242,0.9) 0%, rgba(250,220,217,0.7) 50%, rgba(226,239,230,0.8) 100%);
      position: relative;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 15px 35px rgba(216, 140, 154, 0.1);
    }
    .field { border: 2px solid #F0EBE1; background: #FFFFFF; transition: all 0.3s; }
    .field:focus { border-color: var(--pink-dark); outline: none; }
    
    .btn-pastel {
      background: linear-gradient(135deg, var(--pink-dark), #e29caa);
      color: white;
      box-shadow: 0 4px 15px rgba(216, 140, 154, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .btn-pastel:hover { transform: translateY(-2px); }

    /* สไตล์รูปโพลารอยด์ */
    .polaroid {
      background: #fff;
      padding: 10px 10px 35px 10px; /* ขอบล่างหนาๆ แบบโพลารอยด์ */
      box-shadow: 0 4px 10px rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.05);
      border-radius: 4px;
      display: inline-block;
      transform: rotate(-2deg);
      transition: transform 0.3s ease;
    }
    .polaroid:hover { transform: rotate(0deg) scale(1.02); }
    .polaroid img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #f0f0f0;
      border: 1px solid #eee;
    }

    /* กล่องข้อความอวยพร (ขอบโค้ง) */
    .message-bubble {
      border: 3px solid var(--pink-dark);
      border-radius: 20px;
      padding: 20px;
      background: white;
      position: relative;
      flex-grow: 1;
    }

    /* ซ่อนปุ่มอัปโหลดไฟล์ของเดิม (เพื่อทำปุ่มสวยๆ แทน) */
    input[type="file"] { display: none; }

    .reveal { animation: fadeUp 1s ease-out forwards; opacity: 0; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
 </head>

 <body class="w-full">
  <header class="w-full">
   <section class="hero-bg relative flex w-full items-center justify-center overflow-hidden min-h-[70vh]">
    <div class="relative z-10 mx-auto w-full max-w-4xl px-6 py-20 text-center">
      <p class="font-eng-script reveal text-5xl md:text-6xl text-[#D88C9A] mb-4">Wedding Celebration</p>
      <h1 class="font-romantic reveal text-4xl md:text-5xl font-bold leading-[1.5] text-[#5C4D4D] mb-6">ขอเรียนเชิญร่วมงานมงคลสมรส</h1>
      <p class="reveal mb-10 text-lg max-w-lg mx-auto text-[#7A706A]">ร่วมแสดงความยินดีและเป็นสักขีพยานในวันสำคัญของเรา</p>
      <a href="#write-wish" class="reveal btn-pastel inline-flex items-center rounded-full px-10 py-3 font-medium">ร่วมเขียนคำอวยพร</a>
    </div>
   </section>
  </header>

  <main class="w-full">
   <section id="write-wish" class="w-full px-4 py-16 sm:px-10">
    <div class="mx-auto w-full max-w-6xl">
     <div class="mb-14 text-center reveal">
      <p class="font-eng-script text-4xl text-[#8BA895] mb-2">Guestbook</p>
      <h2 class="font-romantic text-4xl font-bold text-[#5C4D4D]">สมุดอวยพร</h2>
     </div>

     <div class="grid items-start gap-12 lg:grid-cols-[1fr_1.2fr]">
      
      <!-- ฟอร์ม -->
      <form id="wish-form" class="glass-card rounded-[2rem] p-6 sm:p-10 reveal">
       <div class="mb-5">
        <label for="guest-name" class="mb-2 block font-medium text-[#7A706A]">ชื่อของคุณ</label> 
        <input id="guest-name" class="field w-full rounded-2xl px-5 py-3 text-[#5C4D4D]" type="text" required>
       </div>
       
       <div class="mb-5">
        <label for="wish-message" class="mb-2 block font-medium text-[#7A706A]">ข้อความอวยพร</label> 
        <textarea id="wish-message" class="field min-h-[120px] w-full resize-y rounded-2xl px-5 py-3 text-[#5C4D4D]" required></textarea>
       </div>

       <!-- ส่วนแนบรูปภาพ -->
       <div class="mb-6">
        <p class="mb-2 block font-medium text-[#7A706A]">แนบรูปภาพ (ไม่บังคับ)</p>
        <label for="image-upload" class="inline-flex items-center gap-2 px-5 py-3 bg-[#E2EFE6] text-[#8BA895] rounded-xl cursor-pointer hover:bg-[#d1e6d7] transition font-medium border-2 border-dashed border-[#8BA895]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          เลือกรูปภาพโพลารอยด์
        </label>
        <input id="image-upload" type="file" accept="image/*">
        <!-- แสดงรูปตัวอย่างก่อนส่ง -->
        <div id="image-preview-container" class="hidden mt-4">
           <div class="polaroid w-40">
             <img id="image-preview" src="" alt="preview">
           </div>
           <button type="button" id="remove-image" class="block mt-2 text-sm text-red-400 underline">ลบรูป</button>
        </div>
       </div>

       <button id="submit-button" class="btn-pastel w-full rounded-2xl px-6 py-4 font-medium text-lg" type="submit">ส่งคำอวยพร 🤍</button>
       
       <div class="mt-4 h-6 text-center text-sm font-medium">
         <p id="sending-status" class="hidden text-[#8BA895]">กำลังส่งข้อมูล...</p>
         <p id="success-status" class="hidden text-[#D88C9A]">ส่งคำอวยพรเรียบร้อย ขอบคุณครับ/ค่ะ!</p>
         <p id="error-status" class="hidden text-red-400">เกิดข้อผิดพลาด ลองใหม่อีกครั้ง</p>
       </div>
      </form>

      <!-- รายการอวยพร -->
      <div class="reveal">
       <div class="mb-6 flex items-end justify-between gap-4 border-b border-[#E2EFE6] pb-4">
        <h2 class="font-romantic text-2xl font-bold text-[#5C4D4D]">ข้อความจากแขกผู้มีเกียรติ</h2>
       </div>
       <div id="wish-list" class="flex flex-col gap-8 max-h-[700px] overflow-y-auto pr-2" style="scrollbar-width: thin;"></div>
      </div>

     </div>
    </div>
   </section>
  </main>
  
  <!-- Template สำหรับการ์ด 1 ใบ -->
  <template id="wish-template">
   <div class="flex flex-col sm:flex-row gap-4 items-start w-full">
     <!-- ส่วนฝั่งซ้าย: รูปโพลารอยด์ (จะถูกซ่อนถ้าไม่มีรูป) -->
     <div data-template-id="image-container" class="w-full sm:w-48 flex-shrink-0 hidden">
       <div class="polaroid w-full max-w-[200px] mx-auto sm:mx-0">
         <img data-template-id="wish-image" src="" alt="guest photo">
       </div>
     </div>

     <!-- ส่วนฝั่งขวา: กล่องข้อความและชื่อ -->
     <div class="message-bubble w-full shadow-sm">
       <div class="bg-[#D88C9A] text-white px-4 py-2 rounded-t-[16px] rounded-br-[16px] inline-block mb-3 shadow-md">
         <h3 data-template-id="wish-name" class="font-bold text-lg"></h3>
       </div>
       <p data-template-id="wish-message" class="whitespace-pre-wrap leading-relaxed text-[#5C4D4D] text-lg font-medium"></p>
       <div class="mt-4 text-right">
         <time data-template-id="wish-date" class="text-xs text-gray-400"></time>
       </div>
     </div>
   </div>
  </template>

  <script>
    const form = document.getElementById('wish-form');
    const submitButton = document.getElementById('submit-button');
    const list = document.getElementById('wish-list');
    const imageInput = document.getElementById('image-upload');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const removeImageBtn = document.getElementById('remove-image');
    
    let base64Image = null; // ตัวแปรเก็บรูปที่แปลงแล้ว

    // --- ระบบย่อขนาดรูปภาพ (สำคัญมาก เพื่อไม่ให้ฐานข้อมูลเต็ม) ---
    imageInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          // สร้าง Canvas เพื่อย่อขนาดรูป
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; // ย่อรูปไม่ให้กว้างเกิน 600px
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // แปลงกลับเป็น Base64 แบบบีบอัดคุณภาพ 70%
          base64Image = canvas.toDataURL('image/jpeg', 0.7);
          
          // แสดงรูปตัวอย่าง
          imagePreview.src = base64Image;
          imagePreviewContainer.classList.remove('hidden');
        }
      }
    });

    // ปุ่มลบรูปภาพ
    removeImageBtn.addEventListener('click', () => {
      imageInput.value = '';
      base64Image = null;
      imagePreviewContainer.classList.add('hidden');
    });

    // --- ระบบส่งข้อมูล ---
    function showStatus(id) {
      ['sending-status', 'success-status', 'error-status'].forEach(key => {
        document.getElementById(key).classList.toggle('hidden', key !== id);
      });
    }

    async function fetchWishes() {
      const response = await fetch('/api/wishes');
      const data = await response.json();
      renderWishes(data);
    }

    function renderWishes(data) {
      list.innerHTML = ''; 
      data.forEach(record => {
        const card = document.getElementById('wish-template').content.cloneNode(true);
        card.querySelector('[data-template-id="wish-name"]').textContent = record.guest_name;
        card.querySelector('[data-template-id="wish-message"]').textContent = record.message;
        
        // ถ้ามีรูปภาพ ให้แสดงกรอบโพลารอยด์
        if (record.image_base64) {
          const imgContainer = card.querySelector('[data-template-id="image-container"]');
          const imgElement = card.querySelector('[data-template-id="wish-image"]');
          imgElement.src = record.image_base64;
          imgContainer.classList.remove('hidden');
        }
        
        const parsed = new Date(record.created_at + 'Z'); 
        card.querySelector('[data-template-id="wish-date"]').textContent = new Intl.DateTimeFormat('th-TH', { dateStyle:'medium', timeStyle:'short' }).format(parsed);
        
        list.appendChild(card);
      });
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      
      const guestName = document.getElementById('guest-name').value.trim();
      const message = document.getElementById('wish-message').value.trim();
      
      submitButton.disabled = true;
      showStatus('sending-status');

      try {
        const response = await fetch('/api/wishes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // ส่งรูปภาพไปด้วย (ถ้าไม่ได้เลือกรูป base64Image จะเป็น null)
          body: JSON.stringify({ guest_name: guestName, message: message, image_base64: base64Image })
        });

        if (response.ok) {
          form.reset();
          removeImageBtn.click(); // เคลียร์รูป
          showStatus('success-status');
          fetchWishes(); 
        } else {
          showStatus('error-status');
        }
      } catch (error) {
        showStatus('error-status');
      } finally {
        submitButton.disabled = false;
        setTimeout(() => { document.getElementById('success-status').classList.add('hidden'); }, 3000);
      }
    });

    fetchWishes();
  </script>
 </body>
</html>
