<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำอวยพรวันแต่งงาน Way & Ann</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --bg-cream: #FCF9F2; 
      --pink-dark: #D88C9A;
      --green-dark: #8BA895;
      --text-main: #333333; 
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      font-family: 'Noto Sans Thai', sans-serif; 
      color: var(--text-main); 
      background-color: var(--bg-cream);
    }
    
    .font-modern-thai { font-family: 'Prompt', sans-serif; }
    .font-elegant-eng { font-family: 'Cormorant Garamond', serif; font-style: italic; }

    .logo-blend { mix-blend-mode: multiply; }

    /* แถบ Navbar ด้านบน */
    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ฟอร์ม */
    .premium-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.02);
    }
    .field { border: 1px solid #E2E2E2; background: #FAFAFA; transition: all 0.3s; }
    .field:focus { border-color: var(--pink-dark); outline: none; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(216, 140, 154, 0.1); }
    
    .btn-pastel {
      background: var(--pink-dark);
      color: white;
      transition: all 0.3s;
    }
    .btn-pastel:hover { background: #c67c8a; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(216, 140, 154, 0.3);}

    /* รูปโพลารอยด์ */
    .polaroid {
      background: #fff;
      padding: 6px 6px 24px 6px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      border-radius: 2px;
      display: inline-block;
      transform: rotate(-1.5deg);
      transition: transform 0.3s;
      cursor: pointer; 
    }
    @media (min-width: 640px) {
      .polaroid { padding: 8px 8px 30px 8px; }
    }
    .polaroid:hover { transform: rotate(0deg) scale(1.05); z-index: 10; }
    .polaroid img { width: 100%; object-fit: cover; background: #f8f8f8; border: 1px solid #f0f0f0; }

    /* กล่องข้อความ */
    .message-bubble {
      background: white;
      border-radius: 12px;
      padding: 16px;
      flex-grow: 1;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid #F0F0F0;
      width: 100%;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .message-bubble { padding: 24px; }
    }
    
    /* -------------------------------------
       CSS พิเศษสำหรับการสลับ ซ้าย-ขวา
    -------------------------------------- */
    .wish-entry {
      display: flex;
      flex-direction: row; /* บังคับให้อยู่บรรทัดเดียวกันเสมอ */
      width: 100%;
      align-items: flex-start;
    }
    /* เมื่อเป็นรายการคู่ (คนที่ 2, 4, 6...) ให้สลับฝั่ง */
    .wish-entry:nth-child(even) {
      flex-direction: row-reverse;
    }
    /* ให้รูปฝั่งขวาเอียงไปอีกด้าน ให้ดูเป็นธรรมชาติ */
    .wish-entry:nth-child(even) .polaroid {
      transform: rotate(2deg);
    }
    .wish-entry:nth-child(even) .polaroid:hover {
      transform: rotate(0deg) scale(1.05);
    }

    input[type="file"] { display: none; }
    .modal-enter { animation: zoomIn 0.3s forwards; }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
 </head>

 <body class="w-full">
  
  <nav class="navbar shadow-sm">
    <img src="logo.png" alt="NJ Logo" class="logo-blend h-12 object-contain" onerror="this.src='logo.jpg'">
  </nav>

  <!-- Hero Section -->
  <header class="relative w-full mt-[70px] bg-[var(--bg-cream)]">
    <div class="relative w-full">
      <img src="cover.jpg" alt="Way and Ann" class="w-full h-auto block" onerror="this.src='cover.png'">
      <div class="absolute bottom-[-1px] left-0 w-full overflow-hidden leading-[0] z-20 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" class="w-full block h-[30px] sm:h-[60px] md:h-[100px]">
          <path d="M1200,120H0V71.51C83.21,104,181,114.51,281,95.51c107.51-20.44,171.18-80.4,260-84,93.63-3.8,154.21,46,248,51,91.31,4.86,163.66-26.63,227-46.51,64.38-20.2,128.46-37,184-24.51Z" fill="#FCF9F2"></path>
        </svg>
      </div>
    </div>
    <div class="relative z-20 text-center w-full px-4 pt-6 pb-16">
      <p class="font-modern-thai text-[#7A706A] text-lg sm:text-xl font-light tracking-wide mb-6">ขอเรียนเชิญร่วมงานมงคลสมรส</p>
      <a href="#write-wish" class="font-modern-thai btn-pastel inline-flex items-center rounded-full px-10 py-3.5 text-white font-medium transition duration-300">
        ร่วมอวยพรบ่าวสาว 🤍
      </a>
    </div>
  </header>

  <!-- เนื้อหาสมุดอวยพร -->
  <main class="w-full relative z-30 bg-var(--bg-cream)">
   <section id="write-wish" class="w-full px-4 py-8 sm:py-16 sm:px-10">
    <div class="mx-auto w-full max-w-6xl">
     
     <div class="mb-16 text-center">
      <p class="font-elegant-eng text-4xl sm:text-5xl text-[#8BA895] mb-2 tracking-wide">Guestbook</p>
      <h2 class="font-modern-thai text-2xl font-medium text-[#4A403A]">สมุดอวยพรบ่าวสาว</h2>
     </div>

     <div class="grid items-start gap-10 lg:grid-cols-[1fr_1.3fr]">
      
      <!-- ฟอร์มกรอกข้อมูล -->
      <form id="wish-form" class="premium-card">
       <div class="mb-6">
        <label for="guest-name" class="font-modern-thai mb-2 block text-sm font-medium text-[#7A706A]">ชื่อของคุณ</label> 
        <input id="guest-name" class="font-modern-thai field w-full rounded-xl px-4 py-3 text-[#4A403A]" type="text" placeholder="ระบุชื่อของคุณ..." required>
       </div>
       
       <div class="mb-6">
        <label for="wish-message" class="font-modern-thai mb-2 block text-sm font-medium text-[#7A706A]">ข้อความอวยพร</label> 
        <textarea id="wish-message" class="font-modern-thai field min-h-[140px] w-full resize-y rounded-xl px-4 py-3 text-[#4A403A]" placeholder="เขียนความรู้สึกดีๆ ถึงบ่าวสาว..." required></textarea>
       </div>

       <div class="mb-8">
        <p class="font-modern-thai mb-2 block text-sm font-medium text-[#7A706A]">แนบรูปภาพ (ไม่บังคับ)</p>
        <label for="image-upload" class="font-modern-thai inline-flex items-center gap-2 px-5 py-3 bg-[#F9F9F9] text-[#8BA895] rounded-xl cursor-pointer hover:bg-[#F0F0F0] transition font-medium border border-[#E2E2E2] text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          เลือกรูปภาพโพลารอยด์
        </label>
        <input id="image-upload" type="file" accept="image/*">
        
        <div id="image-preview-container" class="hidden mt-6 flex items-end gap-3">
           <div class="polaroid w-28 sm:w-32 cursor-default">
             <img id="image-preview" src="" alt="preview" class="h-[120px] sm:h-[140px]">
           </div>
           <button type="button" id="remove-image" class="font-modern-thai block text-sm text-[#D88C9A] hover:text-red-500 transition mb-2">ลบรูปภาพ ✕</button>
        </div>
       </div>

       <button id="submit-button" class="font-modern-thai btn-pastel w-full rounded-xl px-6 py-4 font-medium text-[15px] tracking-wide" type="submit">ส่งข้อความ 🤍</button>
       
       <div class="font-modern-thai mt-5 h-6 text-center text-sm font-medium">
         <p id="sending-status" class="hidden text-[#8BA895]">กำลังส่งข้อมูล...</p>
         <p id="success-status" class="hidden text-[#D88C9A]">ส่งข้อความเรียบร้อย ขอบคุณครับ/ค่ะ!</p>
         <p id="error-status" class="hidden text-red-400">เกิดข้อผิดพลาด ลองใหม่อีกครั้ง</p>
       </div>
      </form>

      <!-- รายการอวยพร -->
      <div class="pt-2">
       <div class="mb-6 flex items-end justify-between gap-4 border-b border-[#EAE5D9] pb-3">
        <h2 class="font-modern-thai text-lg font-medium text-[#4A403A]">ข้อความจากแขกผู้มีเกียรติ</h2>
        <span id="wish-count" class="font-modern-thai text-sm text-[#8BA895]"></span>
       </div>
       <div id="wish-list" class="flex flex-col gap-6 max-h-[700px] overflow-y-auto overflow-x-hidden pr-3 pb-10" style="scrollbar-width: thin; scrollbar-color: #D88C9A transparent;"></div>
      </div>

     </div>
    </div>
   </section>
  </main>
  
  <footer class="w-full py-16 text-center bg-[#F4F1E9]">
     <div class="flex justify-center mb-6">
       <img src="logo.png" alt="NJ Logo" class="logo-blend w-16 opacity-70" onerror="this.src='logo.jpg'">
     </div>
     <p class="font-elegant-eng text-xl text-[#8BA895]">Thank you for being part of our story</p>
  </footer>

  <div id="image-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 transition-opacity cursor-pointer">
    <button id="close-modal" class="absolute top-6 right-6 md:top-10 md:right-10 text-white hover:text-[#D88C9A] transition text-4xl">&times;</button>
    <img id="modal-image" src="" alt="ภาพขยาย" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl modal-enter cursor-default">
  </div>

  <!-- Template สำหรับการ์ดอวยพรแต่ละใบ (สลับฝั่งอัตโนมัติด้วย CSS .wish-entry) -->
  <template id="wish-template">
   <div class="wish-entry gap-3 sm:gap-5 mb-2 transition-transform hover:-translate-y-1 duration-300">
     <!-- รูปโพลารอยด์ (ปรับขนาดให้เล็กหน่อยในมือถือ จะได้ไม่เบียดข้อความ) -->
     <div data-template-id="image-container" class="w-[100px] sm:w-[150px] flex-shrink-0 hidden pt-1">
       <div class="polaroid w-full mx-auto" title="คลิกเพื่อดูรูปใหญ่">
         <!-- ควบคุมความสูงรูปให้สมมาตร -->
         <img data-template-id="wish-image" src="" alt="guest photo" class="h-[100px] sm:h-[150px]">
       </div>
     </div>

     <!-- กล่องข้อความ -->
     <div class="message-bubble">
       <h3 data-template-id="wish-name" class="font-modern-thai font-medium text-[#D88C9A] text-[15px] sm:text-[16px] mb-1 sm:mb-2 truncate"></h3>
       <p data-template-id="wish-message" class="font-modern-thai font-light whitespace-pre-wrap leading-relaxed text-[#5A504A] text-[13px] sm:text-[15px] break-words"></p>
       <div class="mt-3 sm:mt-4 text-right">
         <time data-template-id="wish-date" class="font-modern-thai font-light text-[11px] sm:text-[12px] text-[#A39E9B] tracking-wide"></time>
       </div>
     </div>
   </div>
  </template>

  <script>
    const form = document.getElementById('wish-form');
    const submitButton = document.getElementById('submit-button');
    const list = document.getElementById('wish-list');
    const count = document.getElementById('wish-count');
    const imageInput = document.getElementById('image-upload');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const removeImageBtn = document.getElementById('remove-image');
    
    const imageModal = document.getElementById('image-modal');
    const modalImage = document.getElementById('modal-image');
    const closeModalBtn = document.getElementById('close-modal');
    
    let base64Image = null;

    function openModal(imgSrc) {
      modalImage.src = imgSrc;
      imageModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; 
    }
    
    function closeModal() {
      imageModal.classList.add('hidden');
      setTimeout(() => { modalImage.src = ''; }, 300);
      document.body.style.overflow = ''; 
    }

    closeModalBtn.addEventListener('click', closeModal);
    imageModal.addEventListener('click', (e) => {
      if (e.target === imageModal) closeModal();
    });

    imageInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800; 
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          base64Image = canvas.toDataURL('image/jpeg', 0.8);
          
          imagePreview.src = base64Image;
          imagePreviewContainer.classList.remove('hidden');
        }
      }
    });

    removeImageBtn.addEventListener('click', () => {
      imageInput.value = '';
      base64Image = null;
      imagePreviewContainer.classList.add('hidden');
    });

    function showStatus(id) {
      ['sending-status', 'success-status', 'error-status'].forEach(key => {
        document.getElementById(key).classList.toggle('hidden', key !== id);
      });
    }

    async function fetchWishes() {
      const response = await fetch('/api/wishes');
      const data = await response.json();
      renderWishes(data);
    }

    function renderWishes(data) {
      list.innerHTML = ''; 
      count.textContent = `${data.length} ข้อความ`;
      data.forEach(record => {
        const card = document.getElementById('wish-template').content.cloneNode(true);
        card.querySelector('[data-template-id="wish-name"]').textContent = record.guest_name;
        card.querySelector('[data-template-id="wish-message"]').textContent = record.message;
        
        if (record.image_base64) {
          const imgContainer = card.querySelector('[data-template-id="image-container"]');
          const imgElement = card.querySelector('[data-template-id="wish-image"]');
          
          imgElement.src = record.image_base64;
          imgContainer.classList.remove('hidden');
          
          const polaroidDiv = imgContainer.querySelector('.polaroid');
          polaroidDiv.addEventListener('click', () => {
            openModal(record.image_base64);
          });
        }
        
        const parsed = new Date(record.created_at + 'Z'); 
        card.querySelector('[data-template-id="wish-date"]').textContent = new Intl.DateTimeFormat('th-TH', { dateStyle:'medium', timeStyle:'short' }).format(parsed);
        
        list.appendChild(card);
      });
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      
      const guestName = document.getElementById('guest-name').value.trim();
      const message = document.getElementById('wish-message').value.trim();
      
      submitButton.disabled = true;
      submitButton.innerHTML = "กำลังส่ง...";
      showStatus('sending-status');

      try {
        const response = await fetch('/api/wishes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guest_name: guestName, message: message, image_base64: base64Image })
        });

        if (response.ok) {
          form.reset();
          removeImageBtn.click();
          showStatus('success-status');
          fetchWishes(); 
        } else {
          showStatus('error-status');
        }
      } catch (error) {
        showStatus('error-status');
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = "ส่งข้อความ 🤍";
        setTimeout(() => { document.getElementById('success-status').classList.add('hidden'); }, 3000);
      }
    });

    fetchWishes();
  </script>
 </body>
</html>
